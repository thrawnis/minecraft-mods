# One-off maintenance: delete a release and its tag. Started by hand only.
name: delete-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete"
        type: string
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
